<!DOCTYPE html>
<html lang="es">
<meta charset="utf-8">
<title>Pedidos Café Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Poppins:wght@400;500;600&display=swap">
<style>
/* Diseño: app de una columna pensada para el celular del mesero; barra inferior con las pantallas del rol y hojas que suben para tomar pedidos. Colores tomados de la carta (crema + azul rey). */
:root{
  --bg:#FBF6EC; --surface:#FFFFFF; --ink:#13235B; --muted:#5D678E; --line:#E6DDCA;
  --brand:#1239A6; --on-brand:#FFFFFF; --soft:#E6ECFF;
  --ok:#1D7F46; --ok-soft:#DCF2E4; --warn:#9A5B00; --warn-soft:#FCEBCB; --bad:#B8302A; --bad-soft:#FBE0DD;
  --shade:rgba(19,35,91,.08); --scrim:rgba(10,16,40,.45);
  --f-display:"Bricolage Grotesque","Poppins",system-ui,sans-serif;
  --f-body:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1326; --surface:#161D36; --ink:#EEF1FF; --muted:#9BA5CA; --line:#283157;
  --brand:#7C97FF; --on-brand:#0B1020; --soft:#1E2852;
  --ok:#55C88A; --ok-soft:#14352A; --warn:#F2B04A; --warn-soft:#3A2B10; --bad:#FF8076; --bad-soft:#401A17;
  --shade:rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1326; --surface:#161D36; --ink:#EEF1FF; --muted:#9BA5CA; --line:#283157;
  --brand:#7C97FF; --on-brand:#0B1020; --soft:#1E2852;
  --ok:#55C88A; --ok-soft:#14352A; --warn:#F2B04A; --warn-soft:#3A2B10; --bad:#FF8076; --bad-soft:#401A17;
  --shade:rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6); color-scheme:dark}

[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.num,.money{font-variant-numeric:tabular-nums}
b.money,.pp{white-space:nowrap}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px}
.top-l{display:flex;flex-direction:column;min-width:0}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.1;letter-spacing:-.02em;color:var(--brand);overflow-wrap:anywhere}
.demo{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rol-btn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.rol-btn small{font-size:10.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.rol-btn b{font-weight:600;color:var(--brand)}

main.wrap{padding-block:18px 120px}
.vhead{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px 16px;margin-bottom:16px}
.vhead h1{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
.vhead p{margin:4px 0 0;color:var(--muted);max-width:60ch}
h2.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:26px 0 10px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);min-height:44px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:7px 12px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}

.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;background:var(--soft);color:var(--brand);white-space:nowrap}
.chip.nuevo,.chip.off{background:var(--bad-soft);color:var(--bad)}
.chip.preparando{background:var(--warn-soft);color:var(--warn)}
.chip.listo{background:var(--ok-soft);color:var(--ok)}
.chip.en_camino{background:var(--soft);color:var(--brand)}
.chip.entregado{background:transparent;color:var(--muted);border:1px solid var(--line)}

/* Mesas */
.mesas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:720px){.mesas{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mesa{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;min-height:128px;padding:16px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface)}
.mesa .mn{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.02em}
.mesa .chip{white-space:normal}
.mesa .mt{margin-top:auto;color:var(--muted);font-size:13px}
.mesa.st-libre{border-style:dashed;background:transparent}
.mesa.st-libre .chip{background:transparent;border:1px solid var(--line);color:var(--muted)}
.mesa.st-ocupada{background:var(--soft);border-color:transparent}
.mesa.st-listo{background:var(--ok-soft);border-color:var(--ok)}
.mesa.st-listo .chip{background:var(--ok);color:var(--surface)}
.mesa.st-cuenta{background:var(--warn-soft);border-color:var(--warn)}
.mesa.st-cuenta .chip{background:var(--warn);color:var(--surface)}
.mesa.st-llevar{border-color:var(--brand)}
.mesa.st-separada{border-style:dashed;border-color:var(--brand);background:var(--soft)}
.mesa.st-separada .chip{background:var(--brand);color:var(--surface)}
.mesa.st-separada .mt{color:var(--brand);font-weight:600}

/* Tarjetas de pedido */
.list{display:grid;gap:10px}
.grid-k{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
button.card{text-align:left;width:100%}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card-title{font-weight:600;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.items{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.items li{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:4px}
.items .q{font-weight:600;font-variant-numeric:tabular-nums}
.items em{font-style:normal;color:var(--muted)}
.nota{display:block;color:var(--warn);font-size:13px;font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ticket{border-top:4px solid var(--line)}
.ticket.nuevo{border-top-color:var(--bad)}
.ticket.preparando{border-top-color:var(--warn)}
.wait{font-weight:600;font-variant-numeric:tabular-nums;font-size:13px}
.wait.w1{color:var(--warn)} .wait.w2{color:var(--bad)}
.ticket .tipo{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em;overflow-wrap:anywhere}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:22px;color:var(--muted);text-align:center}
.sel{outline:3px solid var(--brand);outline-offset:-1px}
.links{display:flex;gap:8px;flex-wrap:wrap}
.cash{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.cash b{font-family:var(--f-display);font-size:24px;font-weight:800}

/* Caja */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:720px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat .k{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat.main{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.stat.main .k{color:var(--on-brand);opacity:.8}
.cols{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.bars{display:grid;gap:10px}
.bar-l{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.bar-t{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:4px}
.bar-f{height:100%;background:var(--brand);border-radius:99px}
.note{font-size:13px;color:var(--muted)}

/* Admin */
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px 12px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--brand);color:var(--on-brand)}
.fchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.fchips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500}
.fchips button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.arow.off .an{color:var(--muted);text-decoration:line-through}
.an{font-weight:600;overflow-wrap:anywhere}
.aside{display:flex;align-items:center;gap:10px}
.sw{width:48px;height:28px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px var(--shade);transition:left .15s}
.sw.on{background:var(--ok)}
.sw.on::after{left:23px}
.zrow{display:grid;grid-template-columns:minmax(0,1fr) 96px 44px;gap:8px;align-items:end}
.zrow .x{align-self:end;margin-bottom:3px}
.roles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.rolec{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px}
.rolec.on{border-color:var(--brand);background:var(--soft)}
.rolec b{font-family:var(--f-display);font-size:19px;font-weight:800}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.prow select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 8px;min-height:36px}
.addp{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:end}
@media (max-width:480px){.addp{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.addp .btn{grid-column:1/-1}}

/* Barra inferior */
nav.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.nav .wrap{display:grid;max-width:680px}
nav.nav button{position:relative;border:0;background:none;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:500;color:var(--muted)}
nav.nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.nav button.on{color:var(--brand);font-weight:600}
nav.nav .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:var(--surface);font-size:11px;font-weight:600;line-height:18px;text-align:center}

/* Hoja (ventana que sube) */
.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:600px;max-height:92%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -10px 40px var(--shade)}
@media (min-width:720px){.scrim{align-items:center}.panel{border-radius:22px;max-height:88%}}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px 10px}
.sh-head h2{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.02em;margin:0;line-height:1.1;overflow-wrap:anywhere}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.x{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:38px;height:38px;flex:none;font-size:18px;line-height:1;padding:0}
.sh-body{flex:1;overflow:auto;padding:4px 18px 18px;display:flex;flex-direction:column;gap:12px}
.sh-foot{border-top:1px solid var(--line);background:var(--surface);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;flex-wrap:wrap}
.sh-foot .btn{flex:1 1 140px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 12px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:500}
.chips button.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.prod{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 14px}
.prod .pn{font-weight:600}
.prod .pd{color:var(--muted);font-size:13px}
.prod .pp{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.prod .ops{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.prod.off .pn{color:var(--muted)}
.add{width:44px;height:44px;border-radius:12px;border:0;background:var(--brand);color:var(--on-brand);font-size:22px;font-weight:600;position:relative}
.add .cnt{position:absolute;top:-6px;right:-6px;background:var(--ok);color:var(--surface);font-size:11px;min-width:20px;height:20px;line-height:20px;border-radius:99px}
.op{border:1px solid var(--brand);background:transparent;color:var(--brand);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:18px}
.qty span{min-width:1.5em;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.line input{grid-column:1/-1}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:600}
.field input,.field select,.line input,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;box-sizing:border-box;font:inherit;color:inherit}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.totals{display:grid;gap:4px;padding:4px 2px}
.totals .spread:last-child{font-weight:600;font-size:18px;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.err{color:var(--bad);font-weight:500;margin:0}
.hint{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:500}
.pay{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pay .btn{min-height:64px;font-size:16px}
.pay .btn.mx{grid-column:1/-1}
.mix{display:grid;gap:10px}

/* Delivery en 3 pasos */
.panel.wide{height:92%}
.steps{list-style:none;margin:0;padding:0 18px 12px;display:flex;gap:6px}
.steps li{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted);border-top:3px solid var(--line);padding-top:7px}
.steps li span{flex:none;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--ink);font-size:12px;font-weight:600;display:grid;place-items:center}
.steps li.on{color:var(--brand);font-weight:600;border-top-color:var(--brand)}
.steps li.on span{background:var(--brand);color:var(--on-brand)}
.steps li.done{border-top-color:var(--ok)}
.steps li.done span{background:var(--ok);color:var(--surface)}
.w1{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.w1-a{display:flex;flex-direction:column;gap:12px;min-width:0}
.zbtns{display:grid;gap:8px}
.zbtn{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;text-align:left;font-size:14px}
.zbtn.on{border-color:var(--brand);background:var(--soft);color:var(--brand)}
.mini{display:grid;gap:1px}
.modo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:520px;margin-bottom:14px}
.modo .btn{flex-direction:column;gap:2px;min-height:64px;font-size:16px;line-height:1.2}
.modo small{font-size:12px;font-weight:400;opacity:.85}
.w1-solo{max-width:520px}
.vuelto{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:12px 14px}
.vuelto .big{font-family:var(--f-display);font-size:22px;font-weight:800;color:var(--warn)}
.sh-body.b2{overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr);padding-bottom:12px}
.b2[data-v="menu"] .b2-cart,.b2[data-v="cart"] .b2-menu{display:none}
.b2-menu{display:flex;flex-direction:column;min-height:0}
.b2-menu .chips{padding:2px 0 12px;flex:none}
.b2-list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px}
.b2-cart{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px}
@media (min-width:600px){.chips{flex-wrap:wrap;overflow:visible}}
@media (min-width:860px){
  .panel.wide{max-width:1240px;height:96%;max-height:96%}
  .panel.wide .sh-head{padding:10px 18px 6px}
  .panel.wide .sh-head h2{font-size:21px}
  .panel.wide .steps{padding-bottom:8px}
  .panel.wide .sh-foot{padding-block:8px}
  .w1{grid-template-columns:minmax(0,3fr) minmax(0,2fr);align-items:start}
  .sh-body.b2{grid-template-columns:minmax(0,1fr) 320px;gap:18px}
  .b2-menu .chips{padding-bottom:8px;gap:6px}
  .b2-menu .chips button{padding:5px 12px}
  .b2-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));align-content:start;gap:8px}
  .b2-list .prod{padding:8px 8px 8px 12px}
  .b2-list .add{width:38px;height:38px}
  .b2[data-v] .b2-cart,.b2[data-v] .b2-menu{display:flex}
  .b2-cart{border-left:1px solid var(--line);padding-left:18px}
  .only-phone{display:none}
  .sh-foot{justify-content:flex-end}
  .panel.wide .sh-foot .btn{flex:0 1 auto;min-width:170px}
}
/* En laptop, la barra de pantallas pasa al costado */
@media (min-width:1000px){
  body{padding-left:190px}
  nav.nav{top:0;right:auto;width:190px;border-top:0;border-right:1px solid var(--line);padding-top:72px;padding-bottom:0}
  nav.nav .wrap{display:flex;flex-direction:column;gap:4px;padding:8px}
  nav.nav button{flex-direction:row;justify-content:flex-start;gap:10px;font-size:14px;padding:10px 12px;border-radius:10px}
  nav.nav button.on{background:var(--soft)}

}

cocina(){

moto(){
  const listos=S.pedidos.filter(p=>p.tipo==='delivery'&&p.estado==='listo').sort((a,b)=>a.creado-b.creado);
  const ruta=S.pedidos.filter(p=>p.tipo==='delivery'&&p.estado==='en_camino');
  const coc=S.pedidos.filter(p=>p.tipo==='delivery'&&(p.estado==='nuevo'||p.estado==='preparando'));
  [...motoSel].forEach(id=>{if(!listos.some(p=>p.id===id))motoSel.delete(id)});

    h+='<div class="list">'+listos.map(p=>`<button class="card ${motoSel.has(p.id)?'sel':''}" data-act="msel" data-id="${p.id}" aria-pressed="${motoSel.has(p.id)}"><div class="card-top"><span class="card-title">${motoSel.has(p.id)?'✓ ':''}${num(p)} · ${esc(p.cliente.nombre)}</span><span class="chip">${esc(p.cliente.zonaN)}</span></div><div class="meta">${esc(p.cliente.dir)}</div><div class="meta">Listo hace ${mins(p.listoEn||p.creado)} min</div>${cobroHtml(p)}</button>`).join('')+'</div>';

  } else h+='<div class="empty">Nada para llevar por ahora.</div>';
  h+=`<h2 class="sec">En camino (${ruta.length})</h2>`;

  return h;
},
caja(){
  const pag=S.pedidos.filter(p=>p.pagado&&hoy(p));
  const total=pag.reduce((a,p)=>a+tot(p),0);
  const porCobrar=S.pedidos.filter(p=>!p.pagado).reduce((a,p)=>a+tot(p),0);
  const by=(f)=>{const o={};pag.forEach(p=>{const k=f(p);o[k]=(o[k]||0)+tot(p)});return o};
  const canal=by(p=>({mesa:'Mesas',llevar:'Para llevar',delivery:'Delivery',recoger:'Recoger'})[p.tipo]);
  const met={};pag.forEach(p=>(p.pagos||[{m:p.metodo,monto:tot(p)}]).forEach(x=>met[x.m]=(met[x.m]||0)+x.monto));
  const prods={};pag.forEach(p=>p.items.forEach(i=>{prods[i.nombre]=(prods[i.nombre]||0)+i.cant}));
  const top=Object.entries(prods).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const bars=(o,fmt)=>{const e=Object.entries(o).sort((a,b)=>b[1]-a[1]);const mx=Math.max(1,...e.map(x=>x[1]));return e.length?'<div class="bars">'+e.map(([k,v])=>`<div><div class="bar-l"><span>${esc(k)}</span><span class="money">${fmt(v)}</span></div><div class="bar-t"><div class="bar-f" style="width:${(v/mx*100).toFixed(1)}%"></div></div></div>`).join('')+'</div>':'<p class="note">Aún no hay ventas cobradas.</p>'};
  const efe=efectivoMoto(),efeT=efe.reduce((a,p)=>a+efectivoDe(p),0);
  const envios=pag.reduce((a,p)=>a+(p.envio||0),0);
  let h=`<div class="vhead"><div><h1>Caja del día</h1><p>Cuánto se vendió hoy, por dónde y cómo pagaron.</p></div></div>`;
  h+=`<div class="stats"><div class="stat main"><div class="k">Cobrado hoy</div><div class="v">${money(total)}</div></div><div class="stat"><div class="k">Pedidos cobrados</div><div class="v">${pag.length}</div></div><div class="stat"><div class="k">Ticket promedio</div><div class="v">${money(pag.length?total/pag.length:0)}</div></div><div class="stat"><div class="k">Por cobrar</div><div class="v">${money(porCobrar)}</div></div></div>`;
  h+=`<div class="cols" style="margin-top:12px"><div class="card"><b>Ventas por canal</b>${bars(canal,money)}<p class="note">Incluye ${money(envios)} de costo de envío.</p></div><div class="card"><b>Formas de pago</b>${bars(met,money)}</div><div class="card"><b>Lo más vendido</b>${bars(Object.fromEntries(top),v=>v+' und.')}</div><div class="card"><b>Rendición del repartidor</b><p style="margin:0">La moto debe entregar <b class="money">${money(efeT)}</b> en efectivo (${efe.length} pedido${efe.length===1?'':'s'}).</p><button class="btn ok" data-act="rendir" ${efe.length?'':'disabled'}>Recibí el efectivo</button></div></div>`;
  return h;
},
admin(){
  let h=`<div class="vhead"><div><h1>Administración</h1><p>Solo el dueño entra aquí. Los cambios se ven al instante en las demás pantallas.</p></div></div>`;
  h+=`<div class="seg" role="tablist">${[['carta','Carta'],['negocio','Negocio'],['personal','Personal']].map(([k,t])=>`<button class="${adminTab===k?'on':''}" data-act="atab" data-t="${k}" role="tab" aria-selected="${adminTab===k}">${t}</button>`).join('')}</div>`;
  return h+ADMIN[adminTab]();
}};

function render(){
  if(!vistas().includes(view))view=vistas()[0];
  $('#brand').textContent=negocio();
  $('#rol-n').textContent=ROLES[rol].n;
  let ml=0;for(let n=1;n<=S.config.mesas;n++)if(mesaInfo(n).st==='listo')ml++;
  const badge={mesas:ml+[...llevarActivos(),...recogerActivos()].filter(p=>p.estado==='listo').length,delivery:deliveryActivos().length,cocina:enCocina().length,moto:S.pedidos.filter(p=>p.tipo==='delivery'&&(p.estado==='listo'||p.estado==='en_camino')).length,caja:0,admin:S.menu.filter(m=>m.agotado).length};
  const vs=vistas(),nav=$('#nav');
  nav.style.gridTemplateColumns=`repeat(${vs.length},minmax(0,1fr))`;
  nav.innerHTML=vs.map(v=>`<button class="${v===view?'on':''}" data-act="nav" data-v="${v}" ${v===view?'aria-current="page"':''}><svg viewBox="0 0 24 24">${NAV[v][1]}</svg>${NAV[v][0]}${badge[v]?`<span class="badge">${badge[v]}</span>`:''}</button>`).join('');

}

// ---------- Hojas ----------
function openSheet(fn){sheetFn=fn;$('#panel').classList.remove('wide');$('#sheet').hidden=false;fn()}
function closeSheet(){sheetFn=null;draft=null;$('#sheet').hidden=true;$('#panel').classList.remove('wide');$('#panel').innerHTML=''}
const head=(eb,t)=>`<div class="sh-head"><div><div class="eyebrow">${eb}</div><h2>${t}</h2></div><button class="x" data-act="close" aria-label="Cerrar">✕</button></div>`;
function paint(html){
  const body=$('#panel .sh-body'),st=body?body.scrollTop:0,sc={};
  document.querySelectorAll('#panel [data-scroll]').forEach(e=>sc[e.dataset.scroll]=e.scrollTop);
  $('#panel').innerHTML=html;
  if(paint.keep){const nb=$('#panel .sh-body');if(nb)nb.scrollTop=st;document.querySelectorAll('#panel [data-scroll]').forEach(e=>e.scrollTop=sc[e.dataset.scroll]||0)}
  paint.keep=false;
}

function sheetSeparar(n){return()=>{

  paint(head('Mesa '+n,'Separar mesa')+`<div class="sh-body"><p class="note" style="margin:0">Para el cliente que escribe por WhatsApp y avisa que viene a comer.</p><div class="field"><label for="s-nom">Nombre del cliente</label><input id="s-nom" autocomplete="off"></div><div class="two"><div class="field"><label for="s-hora">Hora de llegada</label><input id="s-hora" type="time"></div><div class="field"><label for="s-per">Personas (opcional)</label><input id="s-per" type="number" min="1" inputmode="numeric"></div></div><p class="err" id="s-err" hidden></p></div><div class="sh-foot"><button class="btn ghost" data-act="mesa" data-n="${n}">← Volver</button><button class="btn primary" data-act="sepSave" data-n="${n}">Separar mesa ${n}</button></div>`);
}}

  const m=mesaInfo(n);

  let f=`<button class="btn ${m.ps.length?'':'primary'}" data-act="addMesa" data-n="${n}">${m.ps.length?'+ Agregar algo más':'Tomar pedido'}</button>`;

function sheetLlevar(){
  const ll=llevarActivos().sort((a,b)=>a.creado-b.creado);

const linesHtml=d=>d.items.map((i,k)=>`<div class="line"><div><div class="pn">${esc(i.nombre)}${i.op?` <span class="meta">(${esc(i.op)})</span>`:''}</div><div class="meta money">${money(i.precio*i.cant)}</div></div><div class="qty"><button data-act="qty" data-k="${k}" data-d="-1" aria-label="Quitar uno">−</button><span>${i.cant}</span><button data-act="qty" data-k="${k}" data-d="1" aria-label="Agregar uno">+</button></div><input data-nota="${k}" placeholder="Nota para cocina (opcional)" value="${esc(i.nota)}" aria-label="Nota para cocina"></div>`).join('');
const draftSub=d=>d.items.reduce((a,i)=>a+i.precio*i.cant,0);

const stepsHtml=n=>`<ol class="steps">${['Cliente','Productos','Pago'].map((t,i)=>`<li class="${i+1===n?'on':i+1<n?'done':''}" ${i+1===n?'aria-current="step"':''}><span>${i+1<n?'✓':i+1}</span>${t}</li>`).join('')}</ol>`;
const envioD=d=>d.tipo==='recoger'?0:(d.cliente.envio||0);
const tituloWiz=d=>d.tipo==='recoger'?'Nuevo pedido para recoger':'Nuevo delivery';
function totalesHtml(d){
  const st=draftSub(d),e=envioD(d);
  if(d.tipo==='recoger')return `<div class="totals"><div class="spread"><span>Total</span><span class="money">${money(st)}</span></div></div>`;
  return `<div class="totals"><div class="spread"><span>Productos</span><span class="money">${money(st)}</span></div><div class="spread"><span>Delivery · ${esc(d.cliente.zonaN)}</span><span class="money">${money(e)}</span></div><div class="spread"><span>Total</span><span class="money">${money(st+e)}</span></div></div>`;
}
const clienteMini=d=>{const c=d.cliente;return d.tipo==='recoger'?`<div class="mini"><b>${esc(c.nombre)}</b><span class="meta">Pasa a recoger por el local</span></div>`:`<div class="mini"><b>${esc(c.nombre)}</b><span class="meta num">${esc(c.cel)}</span><span class="meta">${esc(c.dir)}${c.ref?' · '+esc(c.ref):''}</span></div>`};
function mixHtml(total,ctx){
  mixCtx={total,ctx};
  return `<div class="mix"><div class="row" role="group" aria-label="Pago digital">${['Yape','Plin'].map(o=>`<button class="btn small ${mix.otro===o?'primary':''}" data-act="mixOtro" data-o="${o}" aria-pressed="${mix.otro===o}">${o}</button>`).join('')}</div><div class="two"><div class="field"><label for="mx-monto">¿Cuánto paga con ${mix.otro}? (S/)</label><input id="mx-monto" type="number" min="0" step="0.5" inputmode="decimal" value="${esc(mix.monto)}"></div>${ctx==='recoger'?'':`<div class="field"><label for="mx-con">¿Con cuánto paga el efectivo? (S/)</label><input id="mx-con" type="number" min="0" step="0.5" inputmode="decimal" value="${esc(mix.con)}"></div>`}</div><div class="vuelto" id="mix-res">${mixRes()}</div></div>`;
}
function mixRes(){
  const {total,ctx}=mixCtx,o=mix.otro,m=parseFloat(mix.monto);
  if(mix.monto==='')return `<span class="note">Escriba cuánto paga con ${o}: el resto en efectivo se calcula solo.</span>`;
  if(!(m>0))return '<span class="err">Escriba un monto válido.</span>';
  if(m>=total)return `<span class="err">Debe ser menor que el total de ${money(total)}. Si paga todo con ${o}, elija ${o}.</span>`;
  const e=r2(total-m),mo=`<b class="money">${money(m)}</b>`,ef=`<b class="money">${money(e)}</b>`;
  if(ctx==='recoger')return `El cliente hace el ${o} de ${mo} y envía la captura por WhatsApp. Paga ${ef} en efectivo cuando venga a recoger.`;
  if(ctx==='delivery')return `El cliente hace el ${o} de ${mo} y envía la captura por WhatsApp. La moto cobra ${ef} en efectivo.<br>${vueltoHtml(e,mix.con)}`;
  return `${o}: ${mo} · Efectivo: ${ef}.<br>${vueltoHtml(e,mix.con,'darle')}`;
}
function mixError(total,pedirCon){
  const m=parseFloat(mix.monto),o=mix.otro;
  if(!(m>0))return `Escriba cuánto paga con ${o}.`;
  if(m>=total)return `Lo que paga con ${o} debe ser menor que el total de ${money(total)}.`;
  if(pedirCon&&!(parseFloat(mix.con)>=r2(total-m)))return `Escriba con cuánto paga el efectivo: debe cubrir ${money(r2(total-m))}.`;
  return '';
}
function vueltoHtml(total,con,verbo='llevarle'){
  if(con==='')return '<span class="note">Escriba con cuánto va a pagar para calcular el vuelto.</span>';
  const v=parseFloat(con);
  if(!(v>=0))return '<span class="err">Escriba un monto válido.</span>';
  if(v<total)return `<span class="err">Faltan ${money(total-v)} para completar.</span>`;
  if(v===total)return '<b>Paga exacto: no hay vuelto.</b>';
  return `Paga con <b class="money">${money(v)}</b>. Hay que ${verbo} <b class="money big">${money(v-total)}</b> de vuelto.`;
}

  mesa:d=>openSheet(sheetMesa(+d.n)),
  llevar:()=>openSheet(sheetLlevar),
  addMesa:d=>startBuilder({tipo:'mesa',mesa:+d.n}),
  sepForm:d=>openSheet(sheetSeparar(+d.n)),
  sepSave:d=>{
    const n=+d.n,nombre=$('#s-nom').value.trim(),hora=$('#s-hora').value,per=parseInt($('#s-per').value,10);
    if(!nombre)return err('#s-err','Falta el nombre del cliente.');
    if(!hora)return err('#s-err','Falta la hora de llegada.');
    S.reservas[n]={nombre,hora};if(per>0)S.reservas[n].personas=per;
    closeSheet();commit(`Mesa ${n} separada para ${nombre} · ${hora12(hora)}`);
  },
  sepQuitar:(d,b)=>{if(!armed(b))return;delete S.reservas[d.n];commit('Mesa '+d.n+' libre otra vez')},
  addLlevar:()=>{mix=mixVacio();startBuilder({tipo:'llevar',nombreLlevar:'',metodoLlevar:'Efectivo'})},
  serve:d=>{const p=find(d.id);p.estado='entregado';p.entregadoEn=Date.now();commit('Pedido '+num(p)+' entregado')},
  cuenta:d=>{S.cuenta[d.n]=!S.cuenta[d.n];commit(S.cuenta[d.n]?'Mesa '+d.n+' pidió la cuenta':'')},
  cobrar:d=>openSheet(sheetCobrar(+d.n)),
  cobrarMix:d=>{mix=mixVacio();openSheet(sheetCobrarMix(+d.n))},
  pagarMix:d=>{
    const n=+d.n,m=mesaInfo(n),msg=mixError(m.total,true);
    if(msg)return err('#mx-err',msg);
    const monto=parseFloat(mix.monto),v=r2(parseFloat(mix.con)-r2(m.total-monto));
    let resto=monto;
    m.ps.forEach(p=>{const parte=Math.min(resto,tot(p));resto=r2(resto-parte);p.pagos=pagosMix(mix.otro,parte,tot(p));p.pagado=true;p.metodo=metodoDePagos(p.pagos);p.pagadoEn=Date.now();if(p.estado!=='entregado')p.estado='entregado'});
    S.cuenta[n]=false;closeSheet();commit(`Mesa ${n} cobrada: ${money(m.total)}${v>0?' · dar '+money(v)+' de vuelto':''}. Mesa libre.`);
  },
  mixOtro:d=>{if(draft&&draft.tipo==='llevar'&&$('#l-nom')){draft.nombreLlevar=$('#l-nom').value;draft.metodoLlevar=$('#l-met').value}mix.otro=d.o;paint.keep=true;redraw()},
  pagar:d=>{const n=+d.n,m=mesaInfo(n);m.ps.forEach(p=>{p.pagado=true;p.metodo=d.m;p.pagadoEn=Date.now();if(p.estado!=='entregado')p.estado='entregado'});S.cuenta[n]=false;closeSheet();commit(`Mesa ${n} cobrada: ${money(m.total)} con ${d.m}. Mesa libre.`)},
  newDel:()=>{mix=mixVacio();draft={tipo:'delivery',paso:1,cliente:{},items:[],pagoSel:null,pagaCon:''};bcat=(S.cats[0]||{}).id;bview='menu';openSheet(sheetWiz)},
  delDet:d=>openSheet(sheetDelDet(d.id)),
  wzTipo:d=>{wizLeerCliente();draft.tipo=d.t;redraw();if(d.t==='recoger'&&matchMedia('(min-width:860px)').matches)$('#w-nom').focus()},
  wzZona:d=>{wizLeerCliente();const z=S.config.zonas.find(x=>x.id===d.z);Object.assign(draft.cliente,{zona:z.id,zonaN:z.n,envio:+z.envio});redraw()},
  wzNext:()=>{
    if(draft.paso===1){
      wizLeerCliente();const c=draft.cliente;
      if(draft.tipo==='recoger'){
        if(!c.nombre)return err('#w-err','Falta el nombre del cliente.');
        draft.paso++;bview='menu';redraw();return;
      }
      const e=!c.nombre?'Falta el nombre del cliente.':c.cel.length!==9?'El teléfono debe tener 9 dígitos.':!c.dir?'Falta la dirección.':!(c.envio>=0)?'Falta el cobro del delivery (ponga 0 si es gratis).':'';
      if(e)return err('#w-err',e);
      const z=S.config.zonas.find(x=>x.id===c.zona);
      if(!z||+z.envio!==c.envio){c.zona=null;c.zonaN=z&&z.n||'Monto a mano'}
    }
    draft.paso++;bview='menu';redraw();
  },
  wzBack:()=>{draft.paso--;bview='menu';redraw()},
  wzPago:d=>{const c=$('#w-con');if(c)draft.pagaCon=c.value;draft.pagoSel=d.p;redraw()},
  wzBill:d=>{draft.pagaCon=d.v;redraw()},
  wzSend:()=>{
    const d=draft,total=draftSub(d)+envioD(d);
    if(!d.pagoSel)return err('#w-err','Elija con qué va a pagar el cliente.');
    if(d.pagoSel==='mixto'){const msg=mixError(total,d.tipo!=='recoger');if(msg)return err('#w-err',msg)}
    const datosMix=d.pagoSel==='mixto'?{mixto:mix.otro,mixtoMonto:parseFloat(mix.monto)}:{};
    if(d.tipo==='recoger'){
      S.seq++;
      const p={id:uid('p'),n:S.seq,tipo:'recoger',items:d.items,cliente:{nombre:d.cliente.nombre,pago:d.pagoSel,pagaCon:0,...datosMix},envio:0,estado:'nuevo',creado:Date.now(),pagado:false};
      S.pedidos.push(p);closeSheet();
      commit(`Pedido ${num(p)} enviado a cocina · ${p.cliente.nombre} pasa a recoger`);
      return;
    }
    const con=parseFloat(d.pagaCon);
    if(d.pagoSel==='efectivo'&&!(con>=total))return err('#w-err','Escriba con cuánto va a pagar: debe cubrir el total de '+money(total)+'.');
    S.seq++;
    const c=Object.assign({},d.cliente,{pago:d.pagoSel,pagaCon:d.pagoSel==='efectivo'?con:d.pagoSel==='mixto'?parseFloat(mix.con):0},datosMix);
    const p={id:uid('p'),n:S.seq,tipo:'delivery',items:d.items,cliente:c,envio:c.envio,estado:'nuevo',creado:Date.now(),pagado:false};
    const {pago,pagaCon,mixto,mixtoMonto,...guardar}=c;S.clientes[c.cel]=guardar;
    S.pedidos.push(p);closeSheet();
    const v=vuelto(p);
    commit(`Pedido ${num(p)} enviado a cocina`+(v?` · llevar ${money(v)} de vuelto`:''));
  },
  cat:d=>{bcat=d.c;redraw()},
  add:d=>{const m=S.menu.find(x=>x.id===d.pid),op=d.op||'';if(!m||m.agotado)return;const ex=draft.items.find(i=>i.pid===m.id&&i.op===op);if(ex)ex.cant++;else draft.items.push({pid:m.id,nombre:m.nombre,precio:m.precio,cant:1,nota:'',op});paint.keep=true;redraw();toast(m.nombre+(op?' ('+op+')':'')+' agregado')},
  bview:d=>{if(draft.tipo==='llevar'&&$('#l-nom')){draft.nombreLlevar=$('#l-nom').value;draft.metodoLlevar=$('#l-met').value}bview=d.v;redraw()},
  qty:d=>{const i=draft.items[+d.k];i.cant+=+d.d;if(i.cant<=0)draft.items.splice(+d.k,1);if(!draft.items.length)bview='menu';if(draft.tipo==='llevar'&&$('#l-nom')){draft.nombreLlevar=$('#l-nom').value;draft.metodoLlevar=$('#l-met').value}paint.keep=true;redraw()},
  send:()=>{
    const d=draft;
    if(d.tipo==='llevar'){d.nombreLlevar=$('#l-nom').value.trim();d.metodoLlevar=$('#l-met').value;if(!d.nombreLlevar)return err('#l-err','Escriba el nombre del cliente para llamarlo cuando esté listo.');if(d.metodoLlevar==='Mixto'){const msg=mixError(draftSub(d),true);if(msg)return err('#l-err',msg)}}
    S.seq++;
    const p={id:uid('p'),n:S.seq,tipo:d.tipo,items:d.items,envio:0,estado:'nuevo',creado:Date.now(),pagado:false};
    if(d.tipo==='mesa'){p.mesa=d.mesa;S.cuenta[d.mesa]=false;delete S.reservas[d.mesa]}
    if(d.tipo==='llevar'){p.cliente={nombre:d.nombreLlevar};p.pagado=true;p.metodo=d.metodoLlevar;p.pagadoEn=Date.now();if(d.metodoLlevar==='Mixto'){p.pagos=pagosMix(mix.otro,parseFloat(mix.monto),tot(p));p.metodo=metodoDePagos(p.pagos)}}
    S.pedidos.push(p);closeSheet();commit(`Pedido ${num(p)} enviado a cocina`);
  },
  kStart:d=>{const p=find(d.id);p.estado='preparando';p.empezoEn=Date.now();commit()},
  kReady:d=>{const p=find(d.id);p.estado='listo';p.listoEn=Date.now();commit('Pedido '+num(p)+' listo')},
  msel:d=>{motoSel.has(d.id)?motoSel.delete(d.id):motoSel.add(d.id);render()},
  salir:()=>{const n=motoSel.size;motoSel.forEach(id=>{const p=find(id);if(p){p.estado='en_camino';p.salioEn=Date.now()}});motoSel.clear();commit(`La moto salió con ${n} pedido${n>1?'s':''}`)},
  entregar:d=>{const p=find(d.id),pg=p.cliente.pago;p.estado='entregado';p.entregadoEn=Date.now();p.pagado=true;p.pagadoEn=Date.now();if(pg==='mixto'){p.pagos=pagosMix(p.cliente.mixto,+p.cliente.mixtoMonto,tot(p));p.metodo=metodoDePagos(p.pagos)}else p.metodo=METODO_DE[pg];if((pg==='efectivo'||pg==='mixto')&&p.tipo==='delivery')p.rendido=false;if(sheetFn&&!d.keep)closeSheet();commit('Pedido '+num(p)+' entregado')},
  rendir:()=>{const e=efectivoMoto(),t=e.reduce((a,p)=>a+efectivoDe(p),0);e.forEach(p=>p.rendido=true);commit(`Recibido ${money(t)} del repartidor`)},
  reset:(d,b)=>{if(!armed(b))return;S=d.mode==='seed'?seed():blank(S);negDraft=null;motoSel.clear();commit(d.mode==='seed'?'Datos de ejemplo cargados':'Pedidos borrados; la carta se mantiene')},
  // Admin
  atab:d=>{if(adminTab==='negocio')readNeg();adminTab=d.t;render()},
  acat:d=>{adminCat=d.c;render()},
  agotado:d=>{const m=S.menu.find(x=>x.id===d.id);m.agotado=!m.agotado;commit(m.nombre+(m.agotado?' marcado como agotado':' disponible otra vez'))},
  prodEdit:d=>openSheet(sheetProd(d.id||null)),
  prodSave:d=>{
    const nombre=$('#p-nom').value.trim(),precio=parseFloat($('#p-pre').value);
    if(!nombre)return err('#p-err','Escriba el nombre del producto.');
    if(!(precio>0))return err('#p-err','Escriba un precio mayor que cero.');
    const ops=$('#p-ops').value.split(',').map(s=>s.trim()).filter(Boolean);
    const datos={nombre,precio,cat:$('#p-cat').value,desc:$('#p-desc').value.trim(),ops:ops.length?ops:null};
    if(d.id)Object.assign(S.menu.find(x=>x.id===d.id),datos);else S.menu.push(Object.assign({id:uid('m'),agotado:false},datos));
    closeSheet();commit(d.id?'Producto actualizado':nombre+' agregado a la carta');
  },
  prodDel:(d,b)=>{if(!armed(b))return;const m=S.menu.find(x=>x.id===d.id);S.menu=S.menu.filter(x=>x.id!==d.id);closeSheet();commit(m.nombre+' quitado de la carta')},
  catEdit:d=>openSheet(sheetCat(d.id||null)),
  catSave:d=>{
    const n=$('#c-nom').value.trim();if(!n)return err('#c-err','Escriba un nombre.');
    if(d.id)S.cats.find(c=>c.id===d.id).n=n;else{const id=uid('c');S.cats.push({id,n});adminCat=id}
    closeSheet();commit(d.id?'Categoría renombrada':'Categoría “'+n+'” creada');
  },
  catDel:(d,b)=>{if(!armed(b))return;S.cats=S.cats.filter(c=>c.id!==d.id);adminCat='todas';closeSheet();commit('Categoría borrada')},
  zAdd:()=>{readNeg();negDraft.zonas.push({id:uid('z'),n:'',envio:''});render();const i=negDraft.zonas.length-1;const el=$('#z-n-'+i);if(el)el.focus()},
  zDel:d=>{readNeg();negDraft.zonas.splice(+d.i,1);render()},
  negUndo:()=>{negDraft=null;render();toast('Cambios descartados')},
  negSave:()=>{
    readNeg();const d=negDraft,mesas=parseInt(d.mesas,10);
    if(!d.nombre.trim())return err('#n-err','Escriba el nombre del negocio.');
    if(!(mesas>=1&&mesas<=30))return err('#n-err','La cantidad de mesas debe estar entre 1 y 30.');
    const ocupada=S.pedidos.find(p=>p.tipo==='mesa'&&!p.pagado&&p.mesa>mesas);
    if(ocupada)return err('#n-err',`La mesa ${ocupada.mesa} tiene una cuenta abierta. Cóbrela antes de reducir las mesas.`);
    const sep=Object.keys(S.reservas).find(n=>+n>mesas);
    if(sep)return err('#n-err',`La mesa ${sep} está separada. Quite la separación antes de reducir las mesas.`);
    for(const z of d.zonas){const e=parseFloat(z.envio);if(!String(z.n).trim()||!(e>=0))return err('#n-err','Cada zona necesita un nombre y un costo de envío (puede ser 0).');z.n=z.n.trim();z.envio=e}
    S.config={nombre:d.nombre.trim(),mesas,zonas:d.zonas};negDraft=null;commit('Cambios guardados');
  },
  uAct:d=>{const u=S.personal.find(x=>x.id===d.id);u.activo=!u.activo;commit(u.nombre+(u.activo?' tiene acceso otra vez':' ya no tiene acceso'))},
  uAdd:()=>{const n=$('#u-nom').value.trim();if(!n){$('#u-nom').focus();return}S.personal.push({id:uid('u'),nombre:n,rol:$('#u-rol').value,activo:true});commit(n+' agregado al personal')}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b){if(e.target.id==='sheet'&&sheetFn!==sheetWiz)closeSheet();return}
  if(b.disabled)return;
  ACT[b.dataset.act](b.dataset,b);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.nota!==undefined&&draft){draft.items[+t.dataset.nota].nota=t.value}
  if(t.id==='w-cel'){
    const cel=t.value.replace(/\D/g,''),c=S.clientes[cel];
    if(cel.length===9&&c){
      const z=S.config.zonas.find(x=>x.id===c.zona);
      Object.assign(draft.cliente,c,{cel,envio:c.envio??(z?+z.envio:undefined)});
      draft.frecuente=true;redraw();
    }
  }
  if(t.id==='mx-monto'||t.id==='mx-con'){mix[t.id==='mx-monto'?'monto':'con']=t.value;$('#mix-res').innerHTML=mixRes()}
  if(t.id==='w-con'){draft.pagaCon=t.value;$('#w-vuelto').innerHTML=vueltoHtml(draftSub(draft)+draft.cliente.envio,t.value)}
});
document.addEventListener('change',e=>{
  if(e.target.id==='l-met'&&draft){draft.nombreLlevar=$('#l-nom').value;draft.metodoLlevar=e.target.value;paint.keep=true;redraw()}
  if(e.target.dataset.urol){const u=S.personal.find(x=>x.id===e.target.dataset.urol);u.rol=e.target.value;commit(u.nombre+' ahora es '+ROLES[u.rol].n)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetFn&&sheetFn!==sheetWiz)closeSheet()});
// Otra pestaña guardó algo: actualizar sin borrar lo que se está escribiendo
window.addEventListener('storage',e=>{if(e.key!==KEY)return;S=load()||seed();if(view==='admin'||sheetFn===sheetBuilder||sheetFn===sheetWiz||(sheetFn&&$('#panel input')))return;render()});
setInterval(()=>{if(!sheetFn&&['mesas','delivery','cocina','moto'].includes(view))render()},20000);
render();
</script>
