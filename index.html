<!DOCTYPE html>
<html lang="es">
<meta charset="utf-8">
<title>Pedidos Café Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Poppins:wght@400;500;600&display=swap">
<style>
/* Diseño: app de una columna pensada para el celular del mesero; barra inferior con las pantallas del rol y hojas que suben para tomar pedidos. Paleta de cafetería: latte, crema, espresso, caramelo y oliva, en tonos tenues. */
:root{
  --bg:#E8DED1; --surface:#F6F0E7; --ink:#2F2119; --muted:#6B5646; --line:#D5C5B1;
  --brand:#5B3923; --on-brand:#F6F0E7; --soft:#E2D2BF;
  --ok:#4A6840; --ok-soft:#DCE4D1; --warn:#8A531E; --warn-soft:#EFDDC4; --bad:#9E4237; --bad-soft:#EED6CF;
  --shade:rgba(47,33,25,.12); --scrim:rgba(33,22,15,.5); --tk-head:#3E2819; --tk-on:#F6F0E7;
  --mesa:#7A5068;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1D1612; --surface:#291F19; --ink:#F0E5D7; --muted:#B49F8C; --line:#41322A;
  --brand:#D3A06B; --on-brand:#1D1612; --soft:#3A2B21;
  --ok:#93B587; --ok-soft:#25301F; --warn:#DDA765; --warn-soft:#3A2A18; --bad:#E08A7D; --bad-soft:#3E211C;
  --shade:rgba(0,0,0,.4); --scrim:rgba(0,0,0,.6); --tk-head:#3E2819; --tk-on:#F0E5D7; --mesa:#C49AB2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1612; --surface:#291F19; --ink:#F0E5D7; --muted:#B49F8C; --line:#41322A;
  --brand:#D3A06B; --on-brand:#1D1612; --soft:#3A2B21;
  --ok:#93B587; --ok-soft:#25301F; --warn:#DDA765; --warn-soft:#3A2A18; --bad:#E08A7D; --bad-soft:#3E211C;
  --shade:rgba(0,0,0,.4); --scrim:rgba(0,0,0,.6); --tk-head:#3E2819; --tk-on:#F0E5D7; --mesa:#C49AB2; color-scheme:dark}

[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.num,.money{font-variant-numeric:tabular-nums}
b.money,.pp{white-space:nowrap}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px}
.top-l{display:flex;flex-direction:column;min-width:0}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.1;letter-spacing:-.02em;color:var(--brand);overflow-wrap:anywhere}
.demo{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.demo.off{color:var(--bad);font-weight:600}
.rol-btn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.rol-btn small{font-size:10.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.rol-btn b{font-weight:600;color:var(--brand)}

main.wrap{padding-block:18px 120px}
.vhead{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px 16px;margin-bottom:16px}
.vhead h1{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
.vhead p{margin:4px 0 0;color:var(--muted);max-width:60ch}
h2.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:26px 0 10px}

.btn{box-sizing:border-box;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);min-height:44px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:7px 12px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}

.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;background:var(--soft);color:var(--brand);white-space:nowrap}
.chip.nuevo,.chip.off{background:var(--bad-soft);color:var(--bad)}
.chip.preparando{background:var(--warn-soft);color:var(--warn)}
.chip.listo{background:var(--ok-soft);color:var(--ok)}
.chip.en_camino{background:var(--soft);color:var(--brand)}
.chip.edit{background:var(--warn-soft);color:var(--warn)}
.chip.anulado{background:var(--bad-soft);color:var(--bad)}
.chip.entregado{background:transparent;color:var(--muted);border:1px solid var(--line)}

/* Mesas */
.mesas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:720px){.mesas{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mesa{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;min-height:128px;padding:16px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface)}
.mesa .mn{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.02em}
.mesa .chip{white-space:normal}
.mesa .mt{margin-top:auto;color:var(--muted);font-size:13px}
.mesa.st-libre{border-style:dashed;background:transparent}
.mesa.st-libre .chip{background:transparent;border:1px solid var(--line);color:var(--muted)}
.mesa.st-ocupada{background:var(--soft);border-color:transparent}
.mesa.st-listo{background:var(--ok-soft);border-color:var(--ok)}
.mesa.st-listo .chip{background:var(--ok);color:var(--surface)}
.mesa.st-cuenta{background:var(--warn-soft);border-color:var(--warn)}
.mesa.st-cuenta .chip{background:var(--warn);color:var(--surface)}
.mesa.st-llevar{border-color:var(--brand)}
.mesa.st-separada{border-style:dashed;border-color:var(--brand);background:var(--soft)}
.mesa.st-separada .chip{background:var(--brand);color:var(--surface)}
.mesa.st-separada .mt{color:var(--brand);font-weight:600}
.mesa.st-unida{border-style:dotted;border-color:var(--muted);background:transparent}
.mesa.st-unida .chip{background:var(--soft);color:var(--ink)}
.unir-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.unir-g .btn{flex-direction:column;gap:2px;min-height:64px}
.unir-g small{font-size:11px;font-weight:400;opacity:.85}

/* Tickets */
.tk-busca{box-sizing:border-box;width:100%;margin-bottom:12px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit}
.trow{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--muted);border-radius:14px;padding:12px 14px;display:grid;gap:10px;grid-template-columns:auto minmax(0,1fr);align-items:start;overflow-wrap:anywhere}
.trow.t-mesa{border-left-color:var(--mesa)}
.trow.t-recoger{border-left-color:var(--ok)}
.trow.t-delivery{border-left-color:var(--brand)}
.trow.t-llevar{border-left-color:var(--warn)}
.trow.off{opacity:.65}
.t-num{font-family:var(--f-display);font-size:20px;font-weight:800;background:var(--bg);border-radius:10px;padding:8px 10px;font-variant-numeric:tabular-nums}
.t-info{display:grid;gap:4px;min-width:0}
.t-name{font-weight:600;font-size:16px}
.t-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.t-items{font-size:14px}
.t-cambio{font-size:13px;color:var(--warn)}
.t-der{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.t-total{font-family:var(--f-display);font-size:21px;font-weight:800;white-space:nowrap}
.t-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.edit-av{background:var(--warn-soft);border-radius:10px;padding:8px 10px;font-size:13px;display:grid;gap:2px}
.edit-av b{color:var(--warn);font-size:14px}
@media (min-width:860px){
  .trow{grid-template-columns:auto minmax(0,1fr) auto;align-items:center}
  .t-der{grid-column:auto;justify-content:flex-end;flex-wrap:nowrap}
}

/* Tarjetas de pedido */
.list{display:grid;gap:10px}
.grid-k{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
button.card{text-align:left;width:100%}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card-title{font-weight:600;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.items{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.items li{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:4px}
.items .q{font-weight:600;font-variant-numeric:tabular-nums}
.items em{font-style:normal;color:var(--muted)}
.nota{display:block;color:var(--warn);font-size:13px;font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ticket{border-top:4px solid var(--line)}
.ticket.nuevo{border-top-color:var(--bad)}
.ticket.preparando{border-top-color:var(--warn)}
.wait{font-weight:600;font-variant-numeric:tabular-nums;font-size:13px}
.wait.w1{color:var(--warn)} .wait.w2{color:var(--bad)}
.ticket .tipo{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em;overflow-wrap:anywhere}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:22px;color:var(--muted);text-align:center}
.sel{outline:3px solid var(--brand);outline-offset:-1px}
.links{display:flex;gap:8px;flex-wrap:wrap}
.cash{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.cash b{font-family:var(--f-display);font-size:24px;font-weight:800}

/* Caja */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:720px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat .k{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat.main{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.stat.main .k{color:var(--on-brand);opacity:.8}
.cols{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.bars{display:grid;gap:10px}
.bar-l{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.bar-t{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:4px}
.bar-f{height:100%;background:var(--brand);border-radius:99px}
.note{font-size:13px;color:var(--muted)}

/* Admin */
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px 12px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--brand);color:var(--on-brand)}
@media (max-width:420px){.seg{gap:2px}.seg button{padding:9px 6px;font-size:14px}}
.fchips{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:6px;margin-bottom:8px}
.card.catbar{flex-direction:row;text-align:left;}
.catbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.arow .aside{flex-wrap:wrap;justify-content:flex-end}
.chip.oculto{background:var(--soft);color:var(--muted)}
@media (max-width:599px){.list .arow{grid-template-columns:minmax(0,1fr)}.list .arow .aside{justify-content:flex-start}}
.fchips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500}
.fchips button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.arow.off .an{color:var(--muted);text-decoration:line-through}
.an{font-weight:600;overflow-wrap:anywhere}
.aside{display:flex;align-items:center;gap:10px}
.sw{width:48px;height:28px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px var(--shade);transition:left .15s}
.sw.on{background:var(--ok)}
.sw.on::after{left:23px}
.roles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.rolec{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px}
.rolec.on{border-color:var(--brand);background:var(--soft)}
.rolec b{font-family:var(--f-display);font-size:19px;font-weight:800}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.cl-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.cl-res{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.cl-acc{flex-direction:column;align-items:flex-end;gap:6px}
.cl-res div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cl-res b{display:block;font-size:20px;font-family:var(--f-display)}
.cl-res span{font-size:12px;color:var(--muted)}
.prow select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 8px;min-height:36px}
.addp{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:end}
@media (max-width:480px){.addp{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.addp .btn{grid-column:1/-1}}

/* Barra inferior */
nav.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.nav .wrap{display:grid;max-width:680px}
nav.nav button{position:relative;border:0;background:none;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:500;color:var(--muted)}
nav.nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.nav button.on{color:var(--brand);font-weight:600}
nav.nav .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:var(--surface);font-size:11px;font-weight:600;line-height:18px;text-align:center}

/* Hoja (ventana que sube) */
.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:600px;max-height:92%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -10px 40px var(--shade)}
@media (min-width:720px){.scrim{align-items:center}.panel{border-radius:22px;max-height:88%}}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px 10px}
.sh-head h2{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.02em;margin:0;line-height:1.1;overflow-wrap:anywhere}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.x{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:38px;height:38px;flex:none;font-size:18px;line-height:1;padding:0}
.sh-body{flex:1;overflow:auto;padding:4px 18px 18px;display:flex;flex-direction:column;gap:12px}
.sh-foot{border-top:1px solid var(--line);background:var(--surface);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;flex-wrap:wrap}
.sh-foot .btn{flex:1 1 140px}
/* Todas las categorías a la vista, en varias filas: así la elegida nunca queda escondida a un costado */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 18px 12px}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;min-height:34px}
.chips button.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.prod{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 14px}
.prod .pn{font-weight:600}
.prod .pd{color:var(--muted);font-size:13px}
.prod .pp{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.prod.off .pn{color:var(--muted)}
.prod[data-act]{cursor:pointer}
.prod[data-act]:hover{border-color:var(--brand)}
.add{width:44px;height:44px;border-radius:12px;border:0;background:var(--brand);color:var(--on-brand);font-size:22px;font-weight:600;position:relative}
.add .cnt{position:absolute;top:-6px;right:-6px;background:var(--ok);color:var(--surface);font-size:11px;min-width:20px;height:20px;line-height:20px;border-radius:99px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:18px}
.qty span{min-width:1.5em;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:600}
.field input,.field select,.line input,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;box-sizing:border-box;font:inherit;color:inherit}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.totals{display:grid;gap:4px;padding:4px 2px}
.totals .spread:last-child{font-weight:600;font-size:18px;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.err{color:var(--bad);font-weight:500;margin:0}
.hint{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:500}
.pay{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pay .btn{min-height:64px;font-size:16px}
.pay .btn.mx{grid-column:1/-1;flex-direction:column;gap:1px;line-height:1.2}
.mix{display:grid;gap:10px}

/* Delivery en 3 pasos */
.panel.wide{height:92%}
.steps{list-style:none;margin:0;padding:0 18px 12px;display:flex;gap:6px}
.steps li{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted);border-top:3px solid var(--line);padding-top:7px}
.steps li span{flex:none;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--ink);font-size:12px;font-weight:600;display:grid;place-items:center}

caja(){

let clStats=null,clBusca='',clOrden='recientes',clSoloPromo=false;
const TIPO_CL={delivery:'delivery',recoger:'recoger',llevar:'para llevar'};
const totalPedido=p=>(p.items||[]).reduce((a,i)=>a+(+i.precio||0)*(+i.cant||0),0)+(+p.envio||0);
// Resumen por celular: cuántos pedidos de delivery, cuánto gastó y cuándo fue el último (sin anulados)
function resumirClientes(filas){
  const m={};
  filas.forEach(f=>{if(!f.cel)return;const r=m[f.cel]||(m[f.cel]={n:0,total:0,ult:0,tipos:{}});r.n++;r.total+=f.total;r.ult=Math.max(r.ult,f.creado);r.tipos[f.tipo]=(r.tipos[f.tipo]||0)+1});
  return m;
}
async function cargarClientes(){
  if(cargarClientes.va)return;cargarClientes.va=true;
  try{
    if(MODO!=='real'){
      clStats=resumirClientes(S.pedidos.filter(p=>p.cliente&&p.cliente.cel&&!p.anulado).map(p=>({cel:p.cliente.cel,tipo:p.tipo,total:totalPedido(p),creado:p.creado})));
      cargarClientes.va=false;return;  // en la demostración es inmediato: no hace falta redibujar
    } else {
      // Todo el historial, de mil en mil, trayendo solo lo necesario
      const filas=[];
      for(let i=0;;i+=1000){
        const r=await sb.from('pedidos').select('creado,tipo,cel:datos->cliente->>cel,items:datos->items,envio:datos->envio').eq('negocio_id',YO.negocioId).in('tipo',['delivery','recoger','llevar']).eq('anulado',false).order('creado').range(i,i+999);
        if(r.error)throw r.error;
        r.data.forEach(f=>filas.push({cel:f.cel,tipo:f.tipo,total:totalPedido(f),creado:new Date(f.creado).getTime()}));
        if(r.data.length<1000)break;
      }
      clStats=resumirClientes(filas);
    }
  }catch(e){clStats='error';toast(errTxt(e))}
  cargarClientes.va=false;
  if(view==='admin'&&adminTab==='clientes')render();
}
function clientesDatos(){
  const st=clStats&&clStats!=='error'?clStats:{};
  return Object.entries(S.clientes).filter(([cel])=>cel).map(([cel,c])=>({cel,c,s:st[cel]||{n:0,total:0,ult:0,tipos:{}}}));
}
function clientesLista(){
  const q=clBusca.trim().toLowerCase(),qd=q.replace(/\D/g,'');

  const ord={recientes:(a,b)=>b.s.ult-a.s.ult,pedidos:(a,b)=>b.s.n-a.s.n||b.s.ult-a.s.ult,gasto:(a,b)=>b.s.total-a.s.total,nombre:(a,b)=>String(a.c.nombre||'').localeCompare(String(b.c.nombre||''),'es')}[clOrden];
  l.sort(ord);
  if(!l.length)return `<div class="empty">${q||clSoloPromo?'Ningún cliente coincide con la búsqueda.':'Todavía no hay clientes. Se guardan solos al registrar un pedido con celular.'}</div>`;

function descargarClientes(){
  const l=clientesDatos().sort((a,b)=>b.s.ult-a.s.ult);
  if(!l.length){toast('No hay clientes para descargar');return}
  const celda=v=>{const s=String(v??'');return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const ti=(s,k)=>(s.tipos||{})[k]||0;
  const filas=[['Nombre','Celular','Acepta promociones','Dirección','Distrito o ciudad','Referencia','Ubicación','Pedidos','Delivery','Recoger','Para llevar','Total gastado (S/)','Último pedido'],
    ...l.map(({cel,c,s})=>[c.nombre,cel,c.promo?'Sí':'No',c.dir,c.lugar,c.ref,c.ubic,s.n,ti(s,'delivery'),ti(s,'recoger'),ti(s,'llevar'),s.total.toFixed(2),s.ult?new Date(s.ult).toLocaleDateString('es-PE'):''])];
  const csv='\ufeff'+filas.map(f=>f.map(celda).join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='clientes-'+String(S.config.nombre).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast(l.length+' cliente'+(l.length>1?'s':'')+' descargado'+(l.length>1?'s':''));
}

  if(/Password should|weak password/i.test(m))return 'La contraseña es muy débil. Use al menos 8 caracteres, con letras y números.';

  if(/rate limit|too many/i.test(m))return 'Demasiados intentos seguidos. Espere unos minutos y vuelva a probar.';
  if(/Failed to fetch|NetworkError|Load failed|network/i.test(m))return 'No hay conexión a internet. Revise el wifi o los datos y vuelva a probar.';

// ---------- Datos compartidos (etapa 3) ----------
// Idea: la pantalla trabaja con S como siempre. Después de cada cambio se compara S con la última versión
// confirmada por la base de datos ("SYNC") y se envía solo lo distinto. Lo que llega de otros equipos entra
// a S por tiempo real. Si no hay internet, lo pendiente se reintenta solo.
const SYNC={ped:{},mesa:{},cli:{},cat:{},prod:{},va:false,otra:false,trayendo:false,error:'',pend:0,vivo:false,listo:false,debe:false,canal:null,reintento:null};
// Texto estable: la base de datos reordena las claves de los objetos guardados
function canon(o){
  if(Array.isArray(o))return '['+o.map(x=>x===undefined?'null':canon(x)).join(',')+']';
  if(o&&typeof o==='object')return '{'+Object.keys(o).filter(k=>o[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+canon(o[k])).join(',')+'}';
  return JSON.stringify(o===undefined?null:o);
}
const fijar=(o,k,v)=>{if(k in o||v)o[k]=v};
const filaPedido=p=>({negocio_id:YO.negocioId,id:p.id,tipo:p.tipo,mesa:p.tipo==='mesa'?+p.mesa:null,estado:p.estado,pagado:!!p.pagado,anulado:!!p.anulado,datos:p,creado:new Date(p.creado||Date.now()).toISOString()});
function pedidoDeFila(r){const p=clone(r.datos||{});p.id=r.id;p.n=r.n;p.estado=r.estado;fijar(p,'pagado',r.pagado);fijar(p,'anulado',r.anulado);return p}
const MESA_VACIA=canon({cuenta:false,reserva:null,unida_a:null});
const mesaLocal=n=>canon({cuenta:!!S.cuenta[n],reserva:S.reservas[n]||null,unida_a:S.uniones[n]?+S.uniones[n]:null});
const mesaDeFila=r=>canon({cuenta:!!r.cuenta,reserva:r.reserva||null,unida_a:r.unida_a||null});
function mesasLocales(){
  const ns=new Set();for(let n=1;n<=S.config.mesas;n++)ns.add(n);
  [S.cuenta,S.reservas,S.uniones,SYNC.mesa].forEach(o=>Object.keys(o).forEach(k=>ns.add(+k)));
  return [...ns].map(n=>[n,mesaLocal(n)]);
}
function aplicarMesa(n,f){
  const o=JSON.parse(f);
  if(o.cuenta)S.cuenta[n]=true;else delete S.cuenta[n];
  if(o.reserva)S.reservas[n]=o.reserva;else delete S.reservas[n];
  if(o.unida_a)S.uniones[n]=o.unida_a;else delete S.uniones[n];
}
const catDeFila=r=>{const c=clone(r.datos||{});c.id=r.id;c.n=r.nombre;fijar(c,'oculto',r.oculta);return c};
const prodDeFila=r=>{const m=clone(r.datos||{});m.id=r.id;m.cat=r.cat;m.nombre=r.nombre;m.precio=Number(r.precio);fijar(m,'agotado',r.agotado);fijar(m,'oculto',r.oculto);return m};
const filaCat=(c,i)=>({negocio_id:YO.negocioId,id:c.id,nombre:c.n||'',oculta:!!c.oculto,orden:i,datos:c});
const filaProd=(m,i)=>({negocio_id:YO.negocioId,id:m.id,cat:m.cat||'',nombre:m.nombre||'',precio:Number(m.precio)||0,agotado:!!m.agotado,oculto:!!m.oculto,orden:i,datos:m});
const esDueno=()=>rol==='dueno';

function iniciarSync(){
  let sn={};try{sn=JSON.parse(lsGet(KEY+'-sync')||'{}')}catch(e){}
  Object.assign(SYNC,{ped:sn.ped||{},mesa:sn.mesa||{},cli:sn.cli||{},cat:sn.cat||{},prod:sn.prod||{},error:'',pend:0,vivo:false,listo:false});
}
function guardarSync(){
  const ids=new Set([...S.pedidos,...S.anulados].map(p=>p.id)),ped={};
  Object.keys(SYNC.ped).forEach(id=>{if(ids.has(id))ped[id]=SYNC.ped[id]});
  SYNC.ped=ped;
  lsSet(KEY+'-sync',JSON.stringify({ped,mesa:SYNC.mesa,cli:SYNC.cli,cat:SYNC.cat,prod:SYNC.prod}));
}
function pendientes(){
  let n=[...S.pedidos,...S.anulados].filter(p=>canon(p)!==SYNC.ped[p.id]).length;
  n+=mesasLocales().filter(([k,f])=>f!==(SYNC.mesa[k]??MESA_VACIA)).length;
  n+=Object.entries(S.clientes).filter(([c,d])=>c&&canon(d)!==SYNC.cli[c]).length;
  if(esDueno()){
    n+=S.cats.filter(c=>canon(c)!==SYNC.cat[c.id]).length+Object.keys(SYNC.cat).filter(id=>!S.cats.some(c=>c.id===id)).length;
    n+=S.menu.filter(m=>canon(m)!==SYNC.prod[m.id]).length+Object.keys(SYNC.prod).filter(id=>!S.menu.some(m=>m.id===id)).length;
  }
  return n;
}
function pintarEstado(){

const ocupado=()=>view==='admin'||pop||sheetFn===sheetBuilder||sheetFn===sheetWiz||(sheetFn&&$('#panel input, #panel textarea, #panel select'));

// Trae todo del negocio. Lo cambiado aquí y aún no enviado se conserva y se envía después.
async function traerDatos(){
  if(MODO!=='real'||SYNC.trayendo)return;
  SYNC.trayendo=true;
  try{
    // Esperar a que termine un envío en curso
    while(SYNC.va)await new Promise(r=>setTimeout(r,150));
    await traerDatosYa();
  }finally{SYNC.trayendo=false}
}
async function traerDatosYa(){
  const N=YO.negocioId,desde=new Date();desde.setHours(0,0,0,0);desde.setDate(desde.getDate()-1);
  const r=await Promise.all([
    sb.from('pedidos').select('*').eq('negocio_id',N).gte('creado',desde.toISOString()),
    sb.from('pedidos').select('*').eq('negocio_id',N).lt('creado',desde.toISOString()).eq('pagado',false).eq('anulado',false),
    sb.from('mesas_estado').select('*').eq('negocio_id',N),
    sb.from('clientes').select('cel,datos').eq('negocio_id',N),
    sb.from('negocios').select('nombre,ciudad,mesas,ultimo_numero').eq('id',N).single(),
    sb.from('categorias').select('*').eq('negocio_id',N).order('orden'),
    sb.from('productos').select('*').eq('negocio_id',N).order('orden')]);
  const e=r.find(x=>x.error);if(e)throw e.error;
  const [pa,pb,me,cl,ne,ca,pr]=r.map(x=>x.data);
  // Pedidos
  const remoto=new Map([...pa,...pb].map(f=>[f.id,pedidoDeFila(f)]));
  const pend=[...S.pedidos,...S.anulados].filter(p=>canon(p)!==SYNC.ped[p.id]);
  const ped={};remoto.forEach((p,id)=>ped[id]=canon(p));
  const todos=new Map(remoto);pend.forEach(p=>{todos.set(p.id,p);if(!remoto.has(p.id)&&SYNC.ped[p.id]!==undefined)ped[p.id]=SYNC.ped[p.id]});
  const lista=[...todos.values()].sort((a,b)=>(a.creado||0)-(b.creado||0));
  S.pedidos=lista.filter(p=>!p.anulado);S.anulados=lista.filter(p=>p.anulado);SYNC.ped=ped;
  // Mesas
  const remM={};me.forEach(f=>remM[f.mesa]=mesaDeFila(f));
  const pendM=mesasLocales().filter(([n,f])=>f!==(SYNC.mesa[n]??MESA_VACIA));
  S.cuenta={};S.reservas={};S.uniones={};
  Object.entries(remM).forEach(([n,f])=>aplicarMesa(+n,f));
  pendM.forEach(([n,f])=>aplicarMesa(n,f));
  SYNC.mesa=remM;
  // Clientes
  const remC={},pendC=Object.entries(S.clientes).filter(([c,d])=>c&&canon(d)!==SYNC.cli[c]);
  S.clientes={};cl.forEach(f=>{S.clientes[f.cel]=f.datos||{};remC[f.cel]=canon(f.datos||{})});
  pendC.forEach(([c,d])=>S.clientes[c]=d);SYNC.cli=remC;
  // Carta: si la base de datos aún no tiene carta, la del Dueño se sube desde aquí
  if(ca.length||pr.length){
    const yo=esDueno();
    const unir=(remotos,locales,snap,deFila)=>{
      const borrados=new Set(yo?Object.keys(snap).filter(id=>!locales.some(x=>x.id===id)):[]);
      const pendL=yo?locales.filter(x=>canon(x)!==snap[x.id]):[];
      const out=remotos.map(deFila).filter(x=>!borrados.has(x.id));
      pendL.forEach(x=>{const i=out.findIndex(y=>y.id===x.id);if(i>=0)out[i]=x;else out.push(x)});
      const nuevoSnap={};remotos.forEach(f=>nuevoSnap[f.id]=canon(deFila(f)));
      return [out,nuevoSnap];
    };
    [S.cats,SYNC.cat]=unir(ca,S.cats,SYNC.cat,catDeFila);
    [S.menu,SYNC.prod]=unir(pr,S.menu,SYNC.prod,prodDeFila);
  } else {SYNC.cat={};SYNC.prod={}}
  // Negocio
  S.config={nombre:ne.nombre,ciudad:ne.ciudad,mesas:ne.mesas};
  S.seq=Math.max(ne.ultimo_numero||0,...S.pedidos.map(p=>p.n||0),0);
  SYNC.listo=true;SYNC.error='';SYNC.pend=pendientes();
  save();guardarSync();pintarEstado();refrescar();
}

// Envía lo que cambió en este aparato
async function sincronizar(){
  if(MODO!=='real'||!sb||!SYNC.listo)return;
  if(SYNC.va||SYNC.trayendo){SYNC.otra=true;return}
  SYNC.va=true;SYNC.otra=false;
  const N=YO.negocioId;let fallo=null,cambioN=false;
  const ok=r=>{if(r.error){fallo=r.error;return false}return true};
  try{
    // Pedidos nuevos: la base de datos les pone el número
    const todos=[...S.pedidos,...S.anulados];
    const nuevos=todos.filter(p=>SYNC.ped[p.id]===undefined).map(p=>clone(p));
    if(nuevos.length){
      const r=await sb.from('pedidos').insert(nuevos.map(filaPedido)).select('id,n');
      if(r.error&&r.error.code==='23505')nuevos.forEach(p=>SYNC.ped[p.id]='');
      else if(ok(r))r.data.forEach(f=>{
        const env=nuevos.find(p=>p.id===f.id),p=[...S.pedidos,...S.anulados].find(x=>x.id===f.id);
        env.n=f.n;SYNC.ped[f.id]=canon(env);
        if(p&&p.n!==f.n){p.n=f.n;cambioN=true}
        S.seq=Math.max(S.seq,f.n);
      });
    }
    // Pedidos cambiados
    const cambiados=[...S.pedidos,...S.anulados].filter(p=>SYNC.ped[p.id]!==undefined&&canon(p)!==SYNC.ped[p.id]).map(p=>clone(p));
    const rs=await Promise.all(cambiados.map(p=>sb.from('pedidos').update({tipo:p.tipo,mesa:p.tipo==='mesa'?+p.mesa:null,estado:p.estado,pagado:!!p.pagado,anulado:!!p.anulado,datos:p}).eq('negocio_id',N).eq('id',p.id).select('id')));
    rs.forEach((r,i)=>{if(ok(r)){if(r.data.length)SYNC.ped[cambiados[i].id]=canon(cambiados[i]);else delete SYNC.ped[cambiados[i].id]}});
    // Mesas
    const mesas=mesasLocales().filter(([n,f])=>f!==(SYNC.mesa[n]??MESA_VACIA));
    if(mesas.length){
      const r=await sb.from('mesas_estado').upsert(mesas.map(([n,f])=>({negocio_id:N,mesa:n,...JSON.parse(f)})),{onConflict:'negocio_id,mesa'});
      if(ok(r))mesas.forEach(([n,f])=>SYNC.mesa[n]=f);
    }
    // Clientes
    const cls=Object.entries(S.clientes).filter(([c,d])=>c&&canon(d)!==SYNC.cli[c]).map(([c,d])=>[c,canon(d),clone(d)]);
    if(cls.length){
      const r=await sb.from('clientes').upsert(cls.map(([c,,d])=>({negocio_id:N,cel:c,datos:d})),{onConflict:'negocio_id,cel'});
      if(ok(r))cls.forEach(([c,f])=>SYNC.cli[c]=f);
    }
    // Carta (solo el Dueño la cambia)
    if(esDueno()){
      for(const [tabla,lista,snap,fila] of [['categorias',S.cats,SYNC.cat,filaCat],['productos',S.menu,SYNC.prod,filaProd]]){
        const cambia=lista.map((x,i)=>[clone(x),i]).filter(([x])=>canon(x)!==snap[x.id]);
        if(cambia.length){
          const r=await sb.from(tabla).upsert(cambia.map(([x,i])=>fila(x,i)),{onConflict:'negocio_id,id'});
          if(ok(r))cambia.forEach(([x])=>snap[x.id]=canon(x));
        }
        const borrar=Object.keys(snap).filter(id=>!lista.some(x=>x.id===id));
        if(borrar.length){
          const r=await sb.from(tabla).delete().eq('negocio_id',N).in('id',borrar);
          if(ok(r))borrar.forEach(id=>delete snap[id]);
        }
      }
    }
  }catch(e){fallo=e}
  SYNC.va=false;
  SYNC.error=fallo?errTxt(fallo):'';
  SYNC.pend=pendientes();
  guardarSync();
  if(cambioN){save();refrescar()}
  pintarEstado();
  clearTimeout(SYNC.reintento);
  if(SYNC.otra)sincronizar();
  else if(SYNC.pend)SYNC.reintento=setTimeout(sincronizar,fallo?8000:1500);
}

// Recibe al instante lo que cambian los otros equipos
function escuchar(){
  if(SYNC.canal)return;
  const N=YO.negocioId;let primera=true;
  const filtro={schema:'public',filter:'negocio_id=eq.'+N};
  SYNC.canal=sb.channel('negocio-'+N)
    .on('postgres_changes',{event:'INSERT',table:'pedidos',...filtro},x=>llegaPedido(x.new))
    .on('postgres_changes',{event:'UPDATE',table:'pedidos',...filtro},x=>llegaPedido(x.new))
    .on('postgres_changes',{event:'*',table:'mesas_estado',...filtro},x=>llegaMesa(x.new))
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'negocios',filter:'id=eq.'+N},x=>llegaNegocio(x.new))
    .on('postgres_changes',{event:'INSERT',table:'categorias',...filtro},x=>llegaCarta('cat',x.new))
    .on('postgres_changes',{event:'UPDATE',table:'categorias',...filtro},x=>llegaCarta('cat',x.new))
    .on('postgres_changes',{event:'INSERT',table:'productos',...filtro},x=>llegaCarta('prod',x.new))
    .on('postgres_changes',{event:'UPDATE',table:'productos',...filtro},x=>llegaCarta('prod',x.new))
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'categorias'},x=>quitaCarta('cat',x.old))
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'productos'},x=>quitaCarta('prod',x.old))
    .subscribe(st=>{
      SYNC.vivo=st==='SUBSCRIBED';pintarEstado();
      // Al volver la conexión, traer lo que pasó mientras tanto
      if(SYNC.vivo){if(!primera)traerDatos().then(()=>sincronizar()).catch(()=>{});primera=false}
    });
}
function llegaPedido(f){
  if(!f||!f.id||f.negocio_id!==YO.negocioId)return;
  const p=pedidoDeFila(f),firma=canon(p);
  const L=[...S.pedidos,...S.anulados].find(x=>x.id===f.id);
  S.seq=Math.max(S.seq,p.n||0);
  if(L&&SYNC.ped[f.id]!==undefined&&canon(L)!==SYNC.ped[f.id]&&canon(L)!==firma){SYNC.ped[f.id]=firma;return}  // aquí hay un cambio sin enviar: se envía después
  SYNC.ped[f.id]=firma;
  if(L&&canon(L)===firma)return;
  S.pedidos=S.pedidos.filter(x=>x.id!==f.id);S.anulados=S.anulados.filter(x=>x.id!==f.id);
  if(p.anulado)S.anulados.push(p);else{S.pedidos.push(p);S.pedidos.sort((a,b)=>(a.creado||0)-(b.creado||0))}
  save();guardarSync();refrescar();
}
function llegaMesa(f){
  if(!f||f.negocio_id!==YO.negocioId)return;
  const n=f.mesa,firma=mesaDeFila(f),local=mesaLocal(n);
  if(local!==(SYNC.mesa[n]??MESA_VACIA)&&local!==firma){SYNC.mesa[n]=firma;return}
  SYNC.mesa[n]=firma;
  if(local===firma)return;
  aplicarMesa(n,firma);save();guardarSync();refrescar();
}
function llegaNegocio(f){
  if(!f||f.id!==YO.negocioId)return;
  S.seq=Math.max(S.seq,f.ultimo_numero||0);
  const c={nombre:f.nombre,ciudad:f.ciudad,mesas:f.mesas};
  if(canon(c)===canon(S.config))return;
  S.config=c;save();refrescar();
}
function llegaCarta(tipo,f){
  if(!f||f.negocio_id!==YO.negocioId)return;
  const lista=tipo==='cat'?S.cats:S.menu,snap=tipo==='cat'?SYNC.cat:SYNC.prod;
  const x=(tipo==='cat'?catDeFila:prodDeFila)(f),firma=canon(x),i=lista.findIndex(y=>y.id===f.id);
  if(esDueno()&&i>=0&&canon(lista[i])!==snap[f.id]&&canon(lista[i])!==firma){snap[f.id]=firma;return}
  snap[f.id]=firma;
  if(i>=0&&canon(lista[i])===firma)return;
  if(i>=0)lista[i]=x;else lista.push(x);
  save();guardarSync();refrescar();
}
function quitaCarta(tipo,f){
  if(!f||f.negocio_id!==YO.negocioId)return;
  const snap=tipo==='cat'?SYNC.cat:SYNC.prod;delete snap[f.id];
  if(tipo==='cat')S.cats=S.cats.filter(c=>c.id!==f.id);else S.menu=S.menu.filter(m=>m.id!==f.id);
  save();guardarSync();refrescar();
}

document.addEventListener('submit',async e=>{
  const f=e.target.closest('[data-form]');if(!f)return;

  const btn=f.querySelector('[type=submit]');if(btn.disabled)return;
  const v=id=>(($(id)||{}).value||'').trim();

  const fallo=m=>{const el=$('#a-err');if(el){el.textContent=m;el.hidden=false}btn.disabled=false;btn.textContent=txt};
  btn.disabled=true;btn.textContent='Un momento…';$('#a-err').hidden=true;
  try{

      await entrarReal(data.user);
    } else if(k==='crear'){

      const {data,error}=await sb.auth.signUp({email:v('#a-cor'),password:pas,options:{data:{nombre:v('#a-nom')}}});if(error)throw error;
      if(!data.session)return fallo('La cuenta se creó, pero Supabase pide confirmar el correo. El dueño del sistema debe apagar "Confirm email" en Supabase.');
      await entrarReal(data.user);
    } else if(k==='codigo'){
      const {error}=await sb.rpc('usar_codigo',{p_codigo:v('#a-cod')});if(error)throw error;
      const {data,error:e2}=await sb.auth.getUser();if(e2)throw e2;

    } else if(k==='negocio'){

      const {error}=await sb.rpc('crear_negocio',{p_nombre:v('#a-neg'),p_ciudad:v('#a-ciu'),p_mesas:mesas,p_mi_nombre:cuentaNombre||'Dueño'});if(error)throw error;
      const {data,error:e2}=await sb.auth.getUser();if(e2)throw e2;
      await entrarReal(data.user);toast('Negocio creado. Usted es el Dueño.');
    }
  }catch(er){fallo(errTxt(er))}
});

    if(d.editId&&r2(total-d.antes)!==0){
      const dif=r2(total-d.antes);
      aviso=`<div class="edit-av"><b>Antes ${money(d.antes)} · Ahora ${money(total)}</b><span>${dif>0?`Faltan ${money(dif)}.`:`Sobran ${money(-dif)}.`} ${/-pagado$/.test(p||'')?(dif>0?'Si ya pagó por Yape o Plin, pídale la captura de la diferencia, o elija Ambos para cobrarla en efectivo.':'Si ya pagó por Yape o Plin, hay que devolverle la diferencia.'):'Revise el pago antes de guardar.'}</span></div>`;
    }
    let det='<span class="note">Elija cómo va a pagar el cliente.</span>';
    if(p==='mixto'){
      det=mixHtml(total,rec?'recoger':'delivery');
    } else if(rec&&(p==='efectivo'||p==='tarjeta')){
      det=`<div class="vuelto">Paga <b class="money">${money(total)}</b> ${p==='tarjeta'?'con tarjeta (POS)':'en efectivo'} cuando venga a recoger.</div>`;
    } else if(p==='efectivo'){
      const bills=[20,50,100,200].filter(b=>b>total);
      det=`<div class="field"><label for="w-con">¿Con cuánto va a pagar? (S/)</label><input id="w-con" type="number" min="0" step="0.5" inputmode="decimal" value="${esc(d.pagaCon)}"></div><div class="row"><button class="btn small" data-act="wzBill" data-v="${total}">Exacto</button>${bills.map(b=>`<button class="btn small" data-act="wzBill" data-v="${b}">S/ ${b}</button>`).join('')}</div><div class="vuelto" id="w-vuelto">${vueltoHtml(total,d.pagaCon)}</div>`;
    } else if(p==='tarjeta'){
      det=`<div class="vuelto">El repartidor lleva el POS y cobra <b class="money">${money(total)}</b> con tarjeta al entregar.</div>`;
    } else if(p){
      const n=p==='plin-pagado'?'Plin':'Yape';
      det=`<div class="vuelto">El cliente hace el ${n} de <b class="money">${money(total)}</b> y envía la captura por WhatsApp para confirmar su pedido. ${rec?'Al recoger no se le cobra nada.':'La moto no le cobra nada al entregar.'}</div>`;
    }
    return aviso+det;
}

  mesa:d=>openSheet(sheetMesa(+d.n)),

  },
  sepQuitar:(d,b)=>{if(!armed(b))return;delete S.reservas[d.n];commit('Mesa '+d.n+' libre otra vez')},
  addLlevar:()=>{mix=mixVacio();startBuilder({tipo:'llevar',nombreLlevar:'',metodoLlevar:'Efectivo',celLlevar:'',promoLlevar:false})},
  serve:d=>{const p=find(d.id);p.estado='entregado';p.entregadoEn=Date.now();commit('Pedido '+num(p)+' entregado')},
  cuenta:d=>{S.cuenta[d.n]=!S.cuenta[d.n];commit(S.cuenta[d.n]?'Mesa '+d.n+' pidió la cuenta':'')},
  cobrar:d=>openSheet(sheetCobrar(+d.n)),
  cobrarMix:d=>{mix=mixVacio();openSheet(sheetCobrarMix(+d.n))},
  pagarMix:d=>{
    const n=+d.n,m=mesaInfo(n),msg=mixError(m.total,true);
    if(msg)return err('#mx-err',msg);
    const monto=parseFloat(mix.monto),v=r2(parseFloat(mix.con)-r2(m.total-monto));
    let resto=monto;
    m.ps.forEach(p=>{const parte=Math.min(resto,tot(p));resto=r2(resto-parte);p.pagos=pagosMix(mix.otro,parte,tot(p));p.pagado=true;p.metodo=metodoDePagos(p.pagos);p.pagadoEn=Date.now();if(p.estado!=='entregado')p.estado='entregado'});
    const nom=mesaNom(n),habia=unidasDe(n).length;unidasDe(n).forEach(k=>delete S.uniones[k]);S.cuenta[n]=false;closeSheet();commit(`${nom} cobrada: ${money(m.total)}${v>0?' · dar '+money(v)+' de vuelto':''}. ${habia?'Mesas libres y separadas.':'Mesa libre.'}`);
  },

  pagar:d=>{const n=+d.n,m=mesaInfo(n);m.ps.forEach(p=>{p.pagado=true;p.metodo=d.m;p.pagadoEn=Date.now();if(p.estado!=='entregado')p.estado='entregado'});const nom=mesaNom(n),habia=unidasDe(n).length;unidasDe(n).forEach(k=>delete S.uniones[k]);S.cuenta[n]=false;closeSheet();commit(`${nom} cobrada: ${money(m.total)} con ${d.m}. ${habia?'Mesas libres y separadas.':'Mesa libre.'}`)},
  newDel:()=>{mix=mixVacio();draft={tipo:'delivery',paso:1,cliente:{lugar:S.config.ciudad||''},items:[],pagoSel:null,pagaCon:''};bcat=(S.cats[0]||{}).id;bview='menu';openSheet(sheetWiz)},

  wzNext:()=>{
    if(draft.paso===1){
      wizLeerCliente();const c=draft.cliente;
      if(draft.tipo==='recoger'){
        if(!c.nombre)return err('#w-err','Falta el nombre del cliente.');
        if(c.cel.length!==9)return err('#w-err','El celular debe tener 9 dígitos.');
        draft.paso++;bview='menu';redraw();return;
      }
      const e=!c.nombre?'Falta el nombre del cliente.':c.cel.length!==9?'El teléfono debe tener 9 dígitos.':!c.dir?'Falta la dirección.':c.ubic&&!/^https:\/\/\S+$/i.test(c.ubic)?'El enlace de ubicación debe empezar con https:// y no tener espacios.':c.envio<0?'El costo de delivery no puede ser negativo.':'';
      if(e)return err('#w-err',e);
    }
    draft.paso++;bview='menu';redraw();
  },
  wzIr:d=>{
    const n=+d.n;
    if(n<draft.paso){draft.paso=n;bview='menu';redraw();return}
    while(draft.paso<n){
      const p=draft.paso;
      if(p===2&&!draft.items.length){toast('Agregue al menos un producto antes de ir al pago.');break}
      ACT.wzNext();
      if(draft.paso===p)break;
    }
  },

  wzPago:d=>{const c=$('#w-con');if(c)draft.pagaCon=c.value;draft.pagoSel=d.p;redraw()},
  wzBill:d=>{draft.pagaCon=d.v;redraw()},

document.addEventListener('input',e=>{
  const t=e.target;
  if(draft&&draft.cliente){
    const mapa={'w-nom':'nombre','w-cel':'cel','w-dir':'dir','w-lug':'lugar','w-ref':'ref','w-ubi':'ubic'};
    if(mapa[t.id]){draft.cliente[mapa[t.id]]=t.id==='w-cel'?t.value.replace(/\D/g,''):t.value.trim();tkRefrescar();const pr=$('#w-probar');if(pr){const c=draft.cliente;pr.href=mapLink(c);pr.hidden=!(c.dir||c.ubic)}}
    if(t.id==='w-env'){draft.cliente.envio=t.value===''?undefined:parseFloat(t.value);tkRefrescar()}
    if(t.id==='w-env3'){draft.cliente.envio=t.value===''?undefined:parseFloat(t.value);tkRefrescar();$('#w-det').innerHTML=detPago(draft)}
  }
  if(t.id==='w-cel'){
    const cel=t.value.replace(/\D/g,''),c=S.clientes[cel];
    if(cel.length===9&&c){
      const {envio,zona,zonaN,...datos}=c;
      Object.assign(draft.cliente,datos,{cel});
      draft.frecuente=true;redraw();
    }
  }
  if(t.id==='l-cel'&&draft){
    const cel=t.value.replace(/\D/g,''),c=S.clientes[cel];draft.celLlevar=cel;
    if(cel.length===9&&c){const n=$('#l-nom');if(n&&!n.value.trim()&&c.nombre){n.value=c.nombre;draft.nombreLlevar=c.nombre;toast('Cliente frecuente: '+c.nombre)}const pr=$('#l-promo');if(pr&&c.promo){pr.checked=true;draft.promoLlevar=true}}
  }
  if(t.id==='cl-busca'){clBusca=t.value;$('#cl-list').innerHTML=clientesLista()}
  if(t.id==='tk-busca'){ticketBusca=t.value;$('#tk-list').innerHTML=ticketsLista()}
  if(t.id==='pop-nota'&&pop)pop.nota=t.value;
  if(t.id==='mx-monto'||t.id==='mx-con'){mix[t.id==='mx-monto'?'monto':'con']=t.value;$('#mix-res').innerHTML=mixRes();$('#mx-efe').value=mixEfectivo();tkRefrescar()}
  if(t.id==='w-con'){draft.pagaCon=t.value;tkRefrescar();$('#w-vuelto').innerHTML=vueltoHtml(draftSub(draft)+envioD(draft),t.value)}
});
document.addEventListener('change',e=>{
  if(e.target.id==='l-met'&&draft){leerLlevar();paint.keep=true;redraw()}
  if(e.target.id==='w-promo'&&draft&&draft.cliente)draft.cliente.promo=e.target.checked;

      if(error||!data.length){toast(error?errTxt(error):'No se pudo cambiar el rol.');render();return}
      u.rol=data[0].rol;toast(u.nombre+' ahora es '+ROLES[u.rol].n);
